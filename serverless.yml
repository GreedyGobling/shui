org: ${env:SERVERLESS_ORG}
service: shui
useDotenv: true


provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: eu-north-1
  environment:
    JWT_SECRET: ${env:JWT_SECRET}
  iam:
    role: ${env:LAMBDA_ROLE_ARN}

functions:
  register:
    handler: functions/auth/register/index.handler
    events:
      - httpApi:
          path: /auth/register
          method: POST
  login:
    handler: functions/auth/login/index.handler
    events:
      - httpApi:
          path: /auth/login
          method: POST


resources:
  Resources:
    ShuiDB:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ShuiDB
        BillingMode: PAY_PER_REQUEST

        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S

        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL